name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'data/**'
      - 'AscendAPP.slnx'
      - '.github/workflows/windows-installer.yml'
jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path ([System.IO.Path]::Combine([Environment]::GetFolderPath('ProgramFilesX86'), 'Inno Setup 6', 'ISCC.exe'))) -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Build release and installer
        shell: pwsh
        run: .\packaging\Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AscendAPP-Setup-0.10.26-win-x64
          path: artifacts/dist/AscendAPP-Setup-0.10.26-win-x64.exe
          if-no-files-found: error
